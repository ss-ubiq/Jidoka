# Runs the same checks as `pnpm verify` on every push and pull request, so a
# broken build or a broken catalogue link is caught before it reaches Netlify.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      # The build is the real regression test: it statically renders every
      # product, family and keyword page, so a bad data reference fails here.
      - run: pnpm build
