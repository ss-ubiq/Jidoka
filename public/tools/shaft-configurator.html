<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Linear shaft part number configurator: choose family, material, diameter, length, end dimensions and optional processing to build a catalogue-valid item code.">
<title>Linear Shaft Configurator</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface2:#e9eeeb; --ink:#1a221f; --muted:#5d6b66; --line:#d3dbd7; --line2:#b9c4bf;
  --accent:#147a6c; --accent-ink:#ffffff; --accent-soft:#dff0ec;
  --hl:#d2731a; --hl-bg:#fbf0e2; --hl-ink:#7a3f06;
  --ok:#2c7a3f; --warn:#b8651a; --bad:#b3362a; --bad-bg:#fbe9e6;
  --shadow:0 1px 2px rgba(20,40,35,.08),0 6px 18px rgba(20,40,35,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131917; --surface:#1b2320; --surface2:#222c28; --ink:#e6ebe8; --muted:#98a59f; --line:#2e3a35; --line2:#40504a;
    --accent:#3fb7a4; --accent-ink:#0d1a17; --accent-soft:#1c3a34;
    --hl:#f0a24f; --hl-bg:#3a2811; --hl-ink:#ffd9a8;
    --ok:#6cc784; --warn:#f0a24f; --bad:#ef7a6a; --bad-bg:#3a1e1a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131917; --surface:#1b2320; --surface2:#222c28; --ink:#e6ebe8; --muted:#98a59f; --line:#2e3a35; --line2:#40504a;
  --accent:#3fb7a4; --accent-ink:#0d1a17; --accent-soft:#1c3a34;
  --hl:#f0a24f; --hl-bg:#3a2811; --hl-ink:#ffd9a8;
  --ok:#6cc784; --warn:#f0a24f; --bad:#ef7a6a; --bad-bg:#3a1e1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,Segoe UI,Arial,sans-serif;}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;text-wrap:balance;margin:0;letter-spacing:.01em}
.mono{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* embed mode (framed by jidoka.in) */
.embed .top{display:none}
.embed .wrap{padding-top:12px}

/* header */
.top{background:var(--accent);color:var(--accent-ink);padding:14px 22px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.top h1{font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.top .src{font-size:12.5px;opacity:.9}
.top .src b{font-weight:600}
.top .topnav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.top .topnav a{color:var(--accent-ink);text-decoration:none;font-size:13px;font-weight:500;padding:6px 11px;border:1px solid rgba(255,255,255,.45);border-radius:4px;white-space:nowrap}
.top .topnav a:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.8)}
.top .topnav a.primary{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.top .topnav a.primary:hover{opacity:.92}

/* layout */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr) 360px;gap:18px;padding:18px 22px 40px;max-width:1480px;margin:0 auto}
@media (max-width:1100px){.wrap{grid-template-columns:230px minmax(0,1fr)} .result{grid-column:1/-1;position:static}}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr);padding:12px} .fam-list{max-height:none;position:static} .fam-list,.steps,.result,.panel{min-width:0} .pn-code{overflow-wrap:anywhere} .steps .tbl,.steps .table-wrap{overflow-x:auto}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.panel-h{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel-h h2{font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* family list */
.fam-list{max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:12px}
.grp{padding:10px 12px 4px}
.fam{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 12px;color:inherit}
.fam:hover{background:var(--surface2)}
.fam[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.fam img{width:54px;height:30px;object-fit:cover;border-radius:3px;border:1px solid var(--line);background:#fff}
.fam .t{display:block;font-weight:500;font-size:13px;line-height:1.25}
.fam .c{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.fam .c span{font-family:"IBM Plex Mono",monospace;white-space:normal;overflow-wrap:anywhere}

/* steps */
.steps{display:flex;flex-direction:column;gap:14px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.step-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.step-h .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;color:var(--accent-ink);background:var(--accent);border-radius:3px;min-width:26px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.step-h h3{font-size:17px;font-weight:600}
.step-h .val{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--hl-ink);background:var(--hl-bg);padding:2px 8px;border-radius:3px;font-size:13px}
.step-b{padding:12px 14px}
.hint{color:var(--muted);font-size:12.5px;margin-top:8px}
.hint ul{margin:4px 0 0;padding-left:18px}
table.grid{border-collapse:collapse;width:100%;font-size:13px}
table.grid th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.grid td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.grid tr.sel td{background:var(--accent-soft)}
table.grid tr.pick{cursor:pointer}
table.grid tr.pick:hover td{background:var(--surface2)}
table.grid tr.sel.pick:hover td{background:var(--accent-soft)}
.code-cell{font-family:"IBM Plex Mono",monospace;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:4px;padding:6px 10px;min-width:48px;font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:13.5px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[disabled]{opacity:.35;cursor:not-allowed}
.field{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.field:first-child{border-top:0;padding-top:0}
.field label.l{font-weight:500;padding-top:6px}
.field label.l small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],select{background:var(--surface);border:1px solid var(--line2);border-radius:4px;padding:6px 8px;min-width:110px}
input[inputmode]{font-family:"IBM Plex Mono",monospace;width:120px}
input.bad{border-color:var(--bad);background:var(--bad-bg)}
.unit{color:var(--muted);font-size:12.5px}
.msg{font-size:12.5px;color:var(--bad)}
.opt{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.opt:first-child{border-top:0;padding-top:0}
.opt input[type=checkbox]{width:16px;height:16px;margin:3px 0 0}
.opt .oh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.opt .oh b{font-weight:600}
.opt .oh .oc{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:12.5px}
.opt .oi{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px;align-items:center}
.opt .oi label{font-size:12.5px;color:var(--muted)}
.opt .oi input{width:90px;min-width:0;padding:4px 6px}
.opt .on{margin-top:4px}
.opt.na{opacity:.5}
.mini{border-collapse:collapse;font-size:11.5px;margin-top:6px}
.mini td,.mini th{border:1px solid var(--line);padding:2px 7px;text-align:center;font-family:"IBM Plex Mono",monospace}
.mini th{background:var(--surface2);font-weight:600}

/* result */
.result{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:14px}
.pn{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.pn-h{padding:10px 14px;background:var(--hl);color:#fff;display:flex;align-items:center;gap:10px}
.pn-h h2{font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.pn-h .sep{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:11.5px}
.pn-h .sep button{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:3px;padding:1px 7px;font-family:"IBM Plex Mono",monospace;font-size:12px}
.pn-h .sep button[aria-pressed="true"]{background:#fff;color:var(--hl-ink)}
.pn-code{padding:16px 14px 8px;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:22px;line-height:1.3;word-break:break-all;min-height:58px}
.pn-code.incomplete{color:var(--muted);font-weight:500}
.pn-code .ph{color:var(--bad);font-weight:400}
.pn-status{padding:0 14px 12px;font-size:12.5px}
.pn-status.ok{color:var(--ok)}
.pn-status.bad{color:var(--bad)}
.pn-status ul{margin:4px 0 0;padding-left:18px}
.pn-actions{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:4px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-left:0;padding-right:0;font-size:13px}
.btn.ghost:hover{text-decoration:underline}
.spec{padding:6px 14px 12px;border-top:1px solid var(--line)}
.spec dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0 0;font-size:12.5px}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-family:"IBM Plex Mono",monospace}
.list .panel-h .cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.list table{width:100%;border-collapse:collapse;font-size:12.5px}
.list td,.list th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.list th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.list td.c{font-family:"IBM Plex Mono",monospace;font-weight:600;word-break:break-all}
.list input.q{width:56px;min-width:0;padding:3px 5px;font-family:"IBM Plex Mono",monospace}
.list .x{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px}
.list .x:hover{color:var(--bad)}
.list .empty{padding:14px;color:var(--muted);font-size:12.5px}
.list .foot{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;border-top:1px solid var(--line)}
textarea.export{width:100%;min-height:90px;font-family:"IBM Plex Mono",monospace;font-size:12px;border:1px solid var(--line2);border-radius:4px;background:var(--surface);color:inherit;padding:8px;margin:8px 12px 12px;width:calc(100% - 24px)}
.draw{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.draw .step-h{background:var(--surface);}
.draw .step-h .zoom{margin-left:auto;font-size:12px;color:var(--muted)}
.draw img{display:block;width:100%;height:auto;cursor:zoom-in}
.lightbox{position:fixed;inset:0;background:rgba(10,14,13,.82);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;background:#fff;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox .cap{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:12.5px;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:3px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.note{font-size:12px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<style>img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<header class="top">
  <h1>Linear Shaft Configurator</h1>
  <div class="src">Rules taken from the <b id="srcName"></b>, pages 11 to 30. Example build for checking, not an official ordering tool.</div>
  <nav class="topnav" aria-label="Site">
    <a href="/">&larr; JIDOKA home</a>
    <a href="/products/linear-motion-and-bearings/guide-shaft">Guide Shaft product</a>
    <a href="/tools/shaft-configurator">Open in site view</a>
    <a class="primary" href="/request-a-quote">Request a Quote</a>
  </nav>
</header>

<main class="wrap">
  <aside class="panel fam-list" id="famList" aria-label="Shaft families"></aside>
  <section class="steps" id="steps"></section>
  <aside class="result">
    <div class="pn">
      <div class="pn-h"><h2>Part number</h2>
        <div class="sep" id="sepCtl"><span>separator</span>
          <button type="button" data-sep="-" aria-pressed="true">A-B</button>
          <button type="button" data-sep=" " aria-pressed="false">A B</button>
          <button type="button" data-sep="" aria-pressed="false">AB</button>
        </div>
      </div>
      <div class="pn-code" id="pnCode"></div>
      <div class="pn-status" id="pnStatus"></div>
      <div class="pn-actions">
        <button class="btn primary" id="btnQuoteOne" type="button">Request a quote</button>
        <button class="btn" id="btnAdd" type="button">Add to quotation list</button>
        <button class="btn" id="btnCopy" type="button">Copy</button>
      </div>
      <div class="pn-actions" style="padding-top:0"><button class="btn ghost" id="btnAsk" type="button">Not sure about a value? Ask an engineer →</button></div>
      <div class="spec" id="spec"></div>
    </div>
    <div class="panel list" id="list"></div>
  </aside>
</main>
<div class="lightbox" id="lightbox" hidden><img id="lbImg" alt="Catalogue drawing"><div class="cap" id="lbCap"></div></div>
<div class="toast" id="toast" role="status"></div>

const state = { fam:null, variant:null, D:null, L:'', p:{}, opt:{}, sep:'-', list:[], showExport:false };

// ---------- helpers ----------
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fam = () => CAT.families.find(f => f.id === state.fam);
const variant = () => fam() && fam().variants.find(v => v.code === state.variant);
function rowsFor(v){ return (v.rows||[]).filter(r => !(r.notFor||[]).includes(v.code)); }
const row = () => variant() && rowsFor(variant()).find(r => r.D === state.D);
function numVals(){
  const o = { D: state.D, L: Number(state.L) };
  for (const [k,v] of Object.entries(state.p)) { const n = Number(v); if (v !== '' && !isNaN(n)) o[k] = n; }
  return o;
}
function evalExpr(expr){
  if (expr == null) return null;
  if (typeof expr === 'number') return expr;
  const vals = numVals();
  const missing = expr.match(/[A-Z]/g)?.some(l => vals[l] == null);
  if (missing) return null;
  try { return Function(...Object.keys(vals), 'return (' + expr + ')')(...Object.values(vals)); } catch { return null; }
}
function constraint(letter){
  const v = variant(); const r = row();
  let c = v && v.params && v.params[letter];
  if (r && r[letter] != null) c = r[letter];
  return c;
}
function fieldsOf(v){ return (v.fields||[]).filter(f => f !== 'D' && f !== 'L'); }
function label(letter){
  const f = fam(); const l = f.paramLabels && f.paramLabels[letter];
  const std = {M:'Thread size M',N:'Thread size N',P:'Diameter P',Q:'Diameter Q',E:'Length E',F:'Length F',A:'Length A',B:'Length B',S:'Wrench flat position S'};
  return l || std[letter] || letter;
}
function disp(val){ const f = fam(); return (f.paramDisplay && f.paramDisplay[val]) || String(val); }
function fmtRange(c){
  if (!c) return '';
  if (Array.isArray(c)) return c.map(disp).join(', ');
  if (c.free) return 'as per request (free value)';
  const parts = [];
  if (c.min != null) parts.push((c.minExclusive ? '>' : '>=') + ' ' + c.min);
  if (c.max != null) parts.push((c.maxExclusive ? '<' : '<=') + ' ' + c.max);
  if (c.maxExpr != null) parts.push((c.maxExclusive ? '<' : '<=') + ' ' + c.maxExpr.replace('*',' x '));
  if (c.minExpr != null) parts.push((c.minExclusive ? '>' : '>=') + ' ' + c.minExpr.replace('*',' x '));
  return parts.join(', ');
}
function checkNumber(c, val){
  if (val === '' || val == null) return 'required';
  const n = Number(val);
  if (isNaN(n)) return 'must be a number';
  if (!c || c.free) return null;
  if (c.min != null && (c.minExclusive ? n <= c.min : n < c.min)) return 'minimum ' + c.min;
  if (c.max != null && (c.maxExclusive ? n >= c.max : n > c.max)) return 'maximum ' + c.max;
  const mx = evalExpr(c.maxExpr), mn = evalExpr(c.minExpr);
  if (mx != null && (c.maxExclusive ? n >= mx : n > mx)) return (c.maxExclusive ? 'must be below ' : 'maximum ') + mx + ' (' + c.maxExpr.replace('*',' x ') + ')';
  if (mn != null && (c.minExclusive ? n <= mn : n < mn)) return 'minimum ' + mn;
  return null;
}
function optApplies(o){
  const v = variant();
  if (o.appliesTo && v && !o.appliesTo.includes(v.code)) return false;

function build(){

  const issues = []; const parts = [];

  parts.push(v.code);

  const Lerr = r ? checkNumber({min:r.L[0], max:r.L[1]}, state.L) : 'required';
  if (state.L === '') { issues.push('Enter length L'); parts.push('L?'); }
  else if (!Number.isInteger(Number(state.L))) { issues.push('L must be a whole number of mm'); parts.push('L?'); }
  else if (Lerr) { issues.push('L ' + Lerr + ' for D' + state.D); parts.push('L' + state.L); }

    if (Array.isArray(c)) { if (!c.map(String).includes(String(val))) { issues.push(label(fl) + ' not available for D' + state.D); } }
    else { const e = checkNumber(c, val); if (e) issues.push(label(fl) + ' ' + e); }
    parts.push(fl + val);
  }
  for (const o of (f.optional||[])) {
    const s = state.opt[o.code]; if (!s || !s.on) continue;
    if (!optApplies(o)) { issues.push(o.code + ' is not available for this selection'); continue; }
    let txt = o.fmt;
    for (const inp of (o.inputs||[])) {
      const val = (s.in||{})[inp.key];
      if (val === '' || val == null) { issues.push(o.code + ': enter ' + inp.label); txt = txt.replace('{'+inp.key+'}', '?'); }
      else txt = txt.replace('{'+inp.key+'}', val);
    }
    parts.push(txt);
  }
  return { code: parts.join(state.sep), issues, parts };
}

// ---------- rendering ----------
function render(){
  const active = document.activeElement; const aid = active && active.id; const selStart = active && active.selectionStart;
  renderFamilies(); renderSteps(); renderResult(); renderList();
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); try { if (el.type === 'text') { const pos = selStart != null ? selStart : el.value.length; el.setSelectionRange(pos, pos); } } catch(e){} } }
  save();
}
function renderFamilies(){
  const groups = [...new Set(CAT.families.map(f => f.group))];
  let h = '';
  for (const g of groups) {
    h += `<div class="grp eyebrow">${esc(g)}</div>`;
    for (const f of CAT.families.filter(x => x.group === g)) {
      const codes = f.variants.map(v => v.code);
      h += `<button type="button" class="fam" data-fam="${f.id}" aria-pressed="${state.fam===f.id}">
        <img src="${CAT.photos[String(f.page)]||''}" alt="">
        <span><span class="t">${esc(f.title)}</span><span class="c"><span>${esc(codes.join(' '))}</span> · p.${f.catalogPage}</span></span></button>`;
    }
  }
  $('#famList').innerHTML = h;
}
function renderSteps(){
  const f = fam(); const v = variant(); const r = row();
  if (!f) { $('#steps').innerHTML = '<div class="panel"><div class="step-b">Choose a shaft family on the left.</div></div>'; return; }
  let n = 0; let h = '';
  // product drawing from the catalogue page
  const dr = CAT.drawings && CAT.drawings[String(f.page)];
  if (dr) h += `<div class="draw"><div class="step-h"><h3>Product drawing — ${esc(f.title)}</h3><span class="zoom">catalogue p.${f.catalogPage} · click to enlarge</span></div><img src="${dr}" alt="Dimensioned drawing of ${esc(f.title)}" data-lb="1" data-cap="${esc(f.title)} — catalogue page ${f.catalogPage}"></div>`;
  // step 1: variant
  n++;
  h += `<div class="step"><div class="step-h"><span class="n">${n}</span><h3>Type, grade and material</h3>${v?`<span class="val">${v.code}</span>`:''}</div><div class="step-b" style="overflow-x:auto">
  <table class="grid"><thead><tr><th>Code</th><th>Type</th><th>Grade</th><th>D tol.</th><th>Material</th><th>Hardness</th><th>Surface treatment</th></tr></thead><tbody>`;
  for (const vv of f.variants) {
    h += `<tr class="pick ${vv.code===state.variant?'sel':''}" data-variant="${vv.code}"><td class="code-cell">${vv.code}</td><td>${esc(vv.type||'')}</td><td>${esc(vv.grade||'-')}</td><td class="mono">${esc(vv.dtol||'')}</td><td>${esc(vv.material||'')}</td><td>${esc(vv.hardness||'')}</td><td>${esc(vv.surface||'')}</td></tr>`;
  }
  h += `</tbody></table>`;
  const allNotes = [...(f.notes||[]), ...(f.optionalNotes||[]), ...(f.orderExampleNotes||[])];
  if (f.orderExamples && f.orderExamples.length) h += `<div class="hint">Ordering examples printed in the catalogue: ${f.orderExamples.map(x=>`<span class="mono">${esc(x)}</span>`).join(' · ')}</div>`;
  if (allNotes.length) h += `<div class="hint"><ul>${allNotes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  h += `</div></div>`;
  if (!v) { $('#steps').innerHTML = h; return; }
  // step 2: D
  n++;
  const rows = rowsFor(v);
  h += `<div class="step"><div class="step-h"><span class="n">${n}</span><h3>Diameter D (mm)</h3>${state.D!=null?`<span class="val">D${state.D}</span>`:''}</div><div class="step-b"><div class="chips">`;
  for (const rr of rows) h += `<button type="button" class="chip" data-d="${rr.D}" aria-pressed="${rr.D===state.D}">${rr.D}</button>`;
  h += `</div>`;
  if (r) {
    const extras = [];
    if (r.tol) extras.push(`D tolerance ${esc(v.dtol||'')} ${esc(r.tol)}`);
    if (r.C != null) extras.push(`chamfer C ${r.C}`);
    if (r.R != null) extras.push(`R ${r.R}`);
    if (r.d != null) extras.push(`bore d ${r.d}`);
    const skip = new Set(['D','tol','L','C','R','d','notFor','_check', ...fieldsOf(v)]);
    for (const [k,val] of Object.entries(r)) {
      if (skip.has(k) || k.endsWith('tol')) continue;
      const lab = (f.columnLabels && f.columnLabels[k]) || k;
      extras.push(`${esc(lab)} ${esc(Array.isArray(val)?val.join(', '):(typeof val==='object'?fmtRange(val):val))}${r[k+'tol']?' ('+esc(r[k+'tol'])+')':''}`);
    }
    h += `<div class="hint">${extras.join(' · ')}</div>`;
  }
  h += `</div></div>`;
  // step 3: L
  n++;
  const Lerr = r ? checkNumber({min:r.L[0], max:r.L[1]}, state.L) : null;
  const Lint = state.L !== '' && !Number.isInteger(Number(state.L));
  h += `<div class="step"><div class="step-h"><span class="n">${n}</span><h3>Length L (mm)</h3>${state.L!==''&&!Lerr&&!Lint?`<span class="val">L${state.L}</span>`:''}</div><div class="step-b">
    <div class="ctl"><input type="text" inputmode="decimal" autocomplete="off" id="inL" step="1" min="${r?r.L[0]:''}" max="${r?r.L[1]:''}" value="${esc(state.L)}" class="${(state.L!==''&&(Lerr||Lint))?'bad':''}" ${r?'':'disabled'} placeholder="${r?r.L[0]+' to '+r.L[1]:'choose D first'}">
    <span class="unit">${r?`allowed ${r.L[0]} to ${r.L[1]} mm, 1 mm increment`:'choose D first'}</span>
    ${state.L!==''&&Lerr?`<span class="msg">L ${esc(Lerr)}</span>`:''}${Lint?`<span class="msg">whole millimetres only</span>`:''}</div></div></div>`;
  // step 4: other fields
  const fls = fieldsOf(v);
  if (fls.length) {
    n++;
    h += `<div class="step"><div class="step-h"><span class="n">${n}</span><h3>End dimensions</h3><span class="val" style="font-weight:500">${fls.map(x=>x+(state.p[x]??'?')).join(' ')}</span></div><div class="step-b">`;
    for (const fl of fls) {
      const c = constraint(fl); const val = state.p[fl] ?? '';
      const pn = f.paramNotes && f.paramNotes[fl];
      h += `<div class="field"><label class="l" for="in_${fl}">${esc(label(fl))}<small>${esc(fmtRange(c) || (r ? '' : 'choose D first'))}</small>${pn?`<small>${esc(pn)}</small>`:''}</label><div class="ctl">`;
      if (Array.isArray(c)) {
        h += `<div class="chips">` + c.map(o => `<button type="button" class="chip" data-p="${fl}" data-val="${esc(o)}" aria-pressed="${String(o)===String(val)}">${esc(disp(o))}</button>`).join('') + `</div>`;
      } else {
        const e = val === '' ? null : checkNumber(c, val);
        h += `<input type="text" inputmode="decimal" autocomplete="off" id="in_${fl}" data-pin="${fl}" value="${esc(val)}" class="${e?'bad':''}" ${r?'':'disabled'} placeholder="${r?'mm':'choose D first'}"><span class="unit">mm</span>${e?`<span class="msg">${esc(e)}</span>`:''}`;
      }
      h += `</div></div>`;
    }
    if (f.wrenchFlats && fls.includes('S')) {
      const wf = f.wrenchFlats.find(x => x.D === state.D);
      if (wf) h += `<div class="hint">Wrench flats for D${state.D}: width across flats W ${wf.W}, flat length V ${wf.V}</div>`;
    }
    h += `</div></div>`;
  }
  // step 5: optional
  const opts = f.optional || [];
  if (opts.length) {
    n++;
    const onCount = opts.filter(o => state.opt[o.code]?.on).length;
    h += `<div class="step"><div class="step-h"><span class="n">${n}</span><h3>Optional processing</h3>${onCount?`<span class="val">${onCount} selected</span>`:''}</div><div class="step-b">`;
    for (const o of opts) {
      const s = state.opt[o.code] || {on:false, in:{}}; const ok = optApplies(o);
      h += `<div class="opt ${ok?'':'na'}"><input type="checkbox" id="opt_${o.code}" data-opt="${o.code}" ${s.on?'checked':''} ${ok?'':'disabled'}>
        <div><div class="oh"><label for="opt_${o.code}"><b>${esc(o.label)}</b></label><span class="oc">${esc(o.fmt.replace(/\{[a-z]\}/g,'( )'))}</span>${ok?'':'<span class="msg">not available for this selection</span>'}</div>`;
      if (s.on && (o.inputs||[]).length) {
        h += `<div class="oi">` + o.inputs.map(inp => `<label for="oi_${o.code}_${inp.key}">${esc(inp.label)}</label><input type="text" inputmode="decimal" autocomplete="off" id="oi_${o.code}_${inp.key}" data-oi="${o.code}" data-key="${inp.key}" value="${esc((s.in||{})[inp.key] ?? '')}">`).join('') + `</div>`;
      }
      if (o.notes && o.notes.length) h += `<div class="hint on">${o.notes.map(esc).join(' · ')}</div>`;
      if (s.on && o.table && o.table.length) {
        const cols = Object.keys(o.table[0]);
        h += `<table class="mini"><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${o.table.map(tr=>`<tr>${cols.map(c=>`<td>${esc(tr[c]??'')}</td>`).join('')}</tr>`).join('')}</table>`;
      }
      h += `</div></div>`;
    }
    h += `</div></div>`;
  }
  $('#steps').innerHTML = h;
}
function renderResult(){
  const b = build(); const v = variant(); const r = row();
  const el = $('#pnCode');
  el.className = 'pn-code' + (b.issues.length ? ' incomplete' : '');
  el.innerHTML = b.code ? b.parts.map(p => p.includes('?') ? `<span class="ph">${esc(p)}</span>` : esc(p)).join(esc(state.sep)) : '<span class="ph">choose a family</span>';
  const st = $('#pnStatus');
  if (!b.issues.length) { st.className = 'pn-status ok'; st.textContent = 'Valid per catalogue tables'; }
  else { st.className = 'pn-status bad'; st.innerHTML = `To complete:<ul>${b.issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`; }
  $('#btnCopy').disabled = !!b.issues.length; $('#btnAdd').disabled = !!b.issues.length; $('#btnQuoteOne').disabled = !!b.issues.length;
  for (const btn of $('#sepCtl').querySelectorAll('button')) btn.setAttribute('aria-pressed', btn.dataset.sep === state.sep);
  const sp = $('#spec');
  if (!v) { sp.innerHTML = ''; return; }
  const f = fam();
  const dl = [['Family', f.title], ['Type', v.type], ['Grade', v.grade], ['Material', v.material], ['Hardness', v.hardness], ['Surface', v.surface]];
  if (r) { dl.push(['D tolerance', (v.dtol||'') + ' ' + (r.tol||'')]); if (r.C!=null) dl.push(['Chamfer C', r.C]); if (r.R!=null) dl.push(['R', r.R]); if (r.d!=null) dl.push(['Bore d', r.d]); }
  dl.push(['Catalogue page', f.catalogPage]);
  sp.innerHTML = `<div class="eyebrow">Specification</div><dl>${dl.filter(x=>x[1]!=null&&x[1]!=='').map(([k,val])=>`<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`).join('')}</dl>`;
}
function renderList(){
  const L = $('#list');
  let h = `<div class="panel-h"><h2>Quotation list</h2><span class="cnt">${state.list.length} item${state.list.length===1?'':'s'}</span></div>`;
  if (!state.list.length) h += `<div class="empty">Configured part numbers you add appear here. Export copies them as CSV for a quotation request.</div>`;
  else {
    h += `<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Part number</th><th>Qty</th><th></th></tr></thead><tbody>`;
    state.list.forEach((it, i) => { h += `<tr><td class="mono">${i+1}</td><td class="c">${esc(it.code)}</td><td><input class="q" type="text" inputmode="decimal" autocomplete="off" min="1" step="1" id="q_${i}" data-q="${i}" value="${it.qty}"></td><td><button type="button" class="x" data-del="${i}" title="Remove">×</button></td></tr>`; });
    h += `</tbody></table></div>`;
    h += `<div class="foot"><button type="button" class="btn primary" id="btnQuote">Request a quote for this list</button><button type="button" class="btn" id="btnCsv">Copy as CSV</button><button type="button" class="btn" id="btnShow">${state.showExport?'Hide text':'Show as text'}</button><button type="button" class="btn" id="btnClear">Clear list</button></div>`;
    if (state.showExport) h += `<textarea class="export" readonly>${esc(csv())}</textarea>`;
  }
  L.innerHTML = h;
}
function csv(){
  const lines = ['Part number,Qty,Family,Type,Material,Surface,Catalogue page'];
  for (const it of state.list) lines.push([it.code, it.qty, it.family, it.type, it.material, it.surface, it.page].map(x => '"' + String(x??'').replace(/"/g,'""') + '"').join(','));
  return lines.join('\n');
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1600); }
async function copyText(txt){ try { await navigator.clipboard.writeText(txt); toast('Copied'); } catch { state.showExport = true; render(); toast('Clipboard blocked, text shown below'); } }

// ---------- hand-off to jidoka.in enquiry forms ----------
function itemOf(){ const b = build(); const v = variant(); const f = fam(); return { code:b.code, qty:1, family:f.title, type:v.type, material:v.material, surface:v.surface, page:f.catalogPage, issues:b.issues }; }
function handoff(path, items){
  const ref = items.map(it => it.code + (Number(it.qty) > 1 ? ' \u00d7' + it.qty : '')).join(', ');
  const qty = items.length === 1 ? String(items[0].qty) : items.map(it => it.code + ': ' + it.qty).join(', ');
  const notes = 'Configured in the JIDOKA Linear Shaft Configurator (Guide Shaft catalogue):\n'
    + items.map(it => '\u2022 ' + it.code + ' \u2014 qty ' + it.qty + ' \u2014 ' + [it.family, it.type, it.material, it.surface].filter(Boolean).join('; ') + '; catalogue p.' + it.page).join('\n')
    + '\n\nPlease confirm against the current catalogue and quote.';
  const u = new URLSearchParams({ ref, qty, notes, via: 'shaft-configurator' });
  window.top.location.href = path + '?' + u.toString();
}

// ---------- events ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.fam) { selectFamily(t.dataset.fam); return; }
  if (t.dataset.d) { state.D = Number(t.dataset.d); pruneParams(); render(); return; }
  if (t.dataset.p) { state.p[t.dataset.p] = t.dataset.val; render(); return; }
  if (t.dataset.sep != null) { state.sep = t.dataset.sep; render(); return; }
  if (t.dataset.del != null) { state.list.splice(Number(t.dataset.del), 1); render(); return; }
  if (t.id === 'btnCopy') { copyText(build().code); return; }
  if (t.id === 'btnAdd') { const b = build(); if (b.issues.length) return; const v = variant(); const f = fam();
    state.list.push({ code:b.code, qty:1, family:f.title, type:v.type, material:v.material, surface:v.surface, page:f.catalogPage }); render(); toast('Added to list'); return; }
  if (t.id === 'btnCsv') { copyText(csv()); return; }
  if (t.id === 'btnShow') { state.showExport = !state.showExport; render(); return; }
  if (t.id === 'btnClear') { state.list = []; render(); return; }
  if (t.id === 'btnQuote') { if (state.list.length) handoff('/request-a-quote', state.list); return; }
  if (t.id === 'btnQuoteOne') { const it = itemOf(); if (it.issues.length) return; handoff('/request-a-quote', [it]); return; }
  if (t.id === 'btnAsk') { const b = build(); const f = fam();
    const notes = 'Question from the JIDOKA Linear Shaft Configurator' + (f ? ' \u2014 ' + f.title + ' (Guide Shaft catalogue p.' + f.catalogPage + ')' : '') + '.\nCurrent part number: ' + (b.code || '(none yet)') + (b.issues.length ? '\nOpen points: ' + b.issues.join('; ') : '') + '\n\nMy question: ';
    const u = new URLSearchParams({ ref: b.code || '', notes, via: 'shaft-configurator' }); window.top.location.href = '/engineering-desk?' + u.toString(); return; }
});
document.addEventListener('click', e => {
  const im = e.target.closest('img[data-lb]');
  if (im) { $('#lbImg').src = im.src; $('#lbCap').textContent = im.dataset.cap; $('#lightbox').hidden = false; return; }
  if (e.target.closest('#lightbox')) { $('#lightbox').hidden = true; return; }
  const tr = e.target.closest('tr[data-variant]');
  if (tr) { selectVariant(tr.dataset.variant); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lightbox').hidden = true; });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'inL') { state.L = t.value; render(); return; }
  if (t.dataset.pin) { state.p[t.dataset.pin] = t.value; render(); return; }
  if (t.dataset.oi) { const s = state.opt[t.dataset.oi] || (state.opt[t.dataset.oi] = {on:true, in:{}}); s.in = s.in || {}; s.in[t.dataset.key] = t.value; render(); return; }
  if (t.dataset.q != null) { state.list[Number(t.dataset.q)].qty = Math.max(1, parseInt(t.value)||1); save(); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.opt) { const s = state.opt[t.dataset.opt] || (state.opt[t.dataset.opt] = {on:false, in:{}}); s.on = t.checked; render(); }
});
function selectFamily(id){
  if (state.fam === id) return;
  state.fam = id; state.variant = fam().variants[0].code; state.D = null; state.L = ''; state.p = {}; state.opt = {}; render();
}
function selectVariant(code){
  if (state.variant === code) return;
  const prevRows = rowsFor(variant()); state.variant = code;
  const v = variant();
  if (!rowsFor(v).some(r => r.D === state.D)) { state.D = null; }
  pruneParams(); render();
}
function pruneParams(){
  const v = variant(); if (!v) return;
  for (const fl of fieldsOf(v)) { const c = constraint(fl); if (Array.isArray(c) && state.p[fl] != null && !c.map(String).includes(String(state.p[fl]))) delete state.p[fl]; }
}
function save(){ try { localStorage.setItem('shaftcfg', JSON.stringify({fam:state.fam,variant:state.variant,D:state.D,L:state.L,p:state.p,opt:state.opt,sep:state.sep,list:state.list})); } catch(e){} }
function load(){ try { const s = JSON.parse(localStorage.getItem('shaftcfg')||'null'); if (s && CAT.families.some(f=>f.id===s.fam)) Object.assign(state, s); } catch(e){} }

// ---------- init ----------
$('#srcName').textContent = 'JIDOKA Guide Shaft catalogue';
load();
// ---------- part number → state (deep links: ?code=SCE02D10L300M3S10, SCE02-D10-L300-M3-S10, SCD06, SCD) ----------
const VAL = '(T\\d+|\\d+(?:\\.\\d+)?)';
function parseCode(raw){
  const src = String(raw || '').toUpperCase().trim().replace(/\s+/g, ' ');
  const compact = src.replace(/\s/g, '');
  if (!compact) return null;
  const vc = compact.slice(0, 5);
  let f = CAT.families.find(x => x.variants.some(v => v.code === vc));
  let v = f && f.variants.find(x => x.code === vc);
  if (!f) { f = CAT.families.find(x => x.id === compact) || CAT.families.find(x => x.id === compact.slice(0, 3)); if (!f) return null; return { f, v: f.variants[0], full: false }; }
  let rest = compact.slice(5);
  const sep = rest[0] === '-' ? '-' : (/\s/.test(src.slice(5, 6)) ? ' ' : '');
  const out = { f, v, full: false, sep, D: null, L: '', p: {}, opt: {} };
  const take = (letter) => { const m = rest.match(new RegExp('^-?' + letter + VAL)); if (!m) return null; rest = rest.slice(m[0].length); return m[1]; };
  const D = take('D'); if (D != null) { out.D = Number(D); out.full = true; }
  const L = take('L'); if (L != null) out.L = L;
  for (const fl of fieldsOf(v)) { const val = take(fl); if (val != null) out.p[fl] = val; }
  const optional = (f.optional || []).slice().sort((a, b) => b.code.length - a.code.length);
  let guard = 0;
  while (rest.replace(/^-/, '') && guard++ < 20) {
    let hit = false;
    for (const o of optional) {
      const re = new RegExp('^-?' + o.fmt.replace(/[.*+?^$()[\]\\|]/g, '\\$&').replace(/\{(\w+)\}/g, VAL));
      const m = rest.match(re); if (!m) continue;
      const inp = {}; (o.inputs || []).forEach((x, i) => { inp[x.key] = m[i + 1]; });
      out.opt[o.code] = { on: true, in: inp }; rest = rest.slice(m[0].length); hit = true; break;
    }
    if (!hit) break;
  }
  return out;
}
function applyCode(raw){
  const c = parseCode(raw); if (!c) return false;
  state.fam = c.f.id; state.variant = c.v.code; state.D = null; state.L = ''; state.p = {}; state.opt = {}; state.showExport = false;
  if (c.full) { state.D = c.D; state.L = c.L; state.p = c.p; state.opt = c.opt; state.sep = c.sep; }
  else { const r0 = rowsFor(c.v).find(r => r.D === 10) || rowsFor(c.v)[0];
    if (r0) { state.D = r0.D; state.L = String(Math.min(300, r0.L[1])); for (const fl of fieldsOf(c.v)) { const k = r0[fl] ?? (c.v.params||{})[fl]; if (Array.isArray(k)) state.p[fl] = String(k[0]); } } }
  return true;
}
const qsCode = new URLSearchParams(location.search).get('code') || '';
if (!(qsCode && applyCode(qsCode)) && !state.fam) applyCode('SCD'); // realistic default: SCD, D10, L300
render();
</script>
